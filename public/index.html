<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madi Alert</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #eef7fb;
      color: #123;
    }

    header {
      background: #087ea4;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    header p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 3px 15px #0001;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 0;
      border-radius: 8px;
      background: #087ea4;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #056783;
    }

    .secondary {
      background: #555;
    }

    .secondary:hover {
      background: #333;
    }

    .admin {
      margin-top: 25px;
      color: white;
    }

    .admin a {
      color: white;
    }
  </style>

</head>

<body>

  <header>
    <h1>💧 Madi Alert</h1>
    <p>Report faulty water services in your area</p>


<div class="admin">
  <a href="/login.html">User Login</a>
</div>


  </header>

  <main>
    <section class="card">
      <h2>Welcome to Madi Alert</h2>


  <p>
    Please create an account or login before reporting a faulty
    water service.
  </p>

  <button onclick="window.location.href='/register.html'">
    Create Account
  </button>

  <button onclick="window.location.href='/login.html'">
    Login
  </button>
</section>


  </main>

</body>
</html>
