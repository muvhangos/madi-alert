<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madi Alert Admin</title>
<style>body{font-family:Arial;margin:0;background:#eef7fb}.top{background:#087ea4;color:white;padding:18px}.wrap{max-width:1100px;margin:20px auto;padding:10px}.report{background:white;margin:12px 0;padding:16px;border-radius:12px}.report img{max-width:180px;border-radius:8px}select{padding:8px}button{padding:8px;background:#087ea4;color:white;border:0;border-radius:6px}</style>
</head>
<body><div class="top"><h1>💧 Madi Alert Admin</h1><button onclick="logout()">Logout</button></div><div class="wrap"><div id="reports">Loading...</div></div>
<script>
const token=localStorage.token;if(!token) location="/login.html";
async function load(){const r=await fetch("/api/reports",{headers:{Authorization:"Bearer "+token}});if(r.status===401)return location="/login.html";const data=await r.json();reports.innerHTML=data.map(x=>`
<div class="report"><h3>${x.problem} — ${x.status}</h3><p>${x.description}</p><p><b>Reporter:</b> ${x.name} ${x.phone}</p><p><b>Location:</b> ${x.latitude}, ${x.longitude}</p>${x.photo?`<img src="${x.photo}">`:''}<br>
<select onchange="update(${x.id},this.value)"><option ${x.status=="New"?"selected":""}>New</option><option ${x.status=="Investigating"?"selected":""}>Investigating</option><option ${x.status=="Fixed"?"selected":""}>Fixed</option></select></div>`).join("")}
async function update(id,status){await fetch("/api/reports/"+id,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({status})});load()}
function logout(){localStorage.removeItem("token");location="/login.html"} load();
</script></body></html>
