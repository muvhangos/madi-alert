<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Madi Alert Login
  </title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow:
        0 3px 15px #0001;
    }

    h1,
    h2 {
      text-align: center;
    }

    input,
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      background: #087ea4;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #056783;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      font-weight: bold;
      text-align: center;
      min-height: 24px;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .hint {
      font-size: 13px;
      color: #555;
    }

    a {
      color: #087ea4;
      font-weight: bold;
    }
  </style>

</head>

<body>

  <div class="container">

    <h1>💧 Madi Alert</h1>

    <h2>Login</h2>

    <input
      type="tel"
      id="phoneNumber"
      placeholder="+27821234567"
      autocomplete="tel"
    >

    <p class="hint">
      Enter your mobile number with the country code.
      Example: +27821234567
    </p>

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      type="button"
      id="loginButton"
    >
      Login
    </button>

    <p id="message"></p>

    <div class="links">

      <p>
        New user?
        <a href="/register.html">
          Create Account
        </a>
      </p>

      <p>
        <a href="/">
          Back to Home
        </a>
      </p>

    </div>

  </div>

  <script src="/auth.js"></script>

</body>

</html>
