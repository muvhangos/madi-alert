<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madi Alert Login</title>
<style>body{font-family:Arial;background:#eef7fb;padding:40px}.card{max-width:400px;margin:auto;background:white;padding:25px;border-radius:14px}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{background:#087ea4;color:white;border:0;border-radius:8px}a{display:block;margin-top:15px}</style>
</head>
<body><div class="card"><h2>Admin Login</h2><form id="login"><input id="email" type="email" placeholder="Email" value="admin@madzi.local" required><input id="password" type="password" placeholder="Password" value="admin123" required><button>Login</button></form><p id="msg"></p><a href="/">← Back to report page</a></div>
<script>login.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(r.ok){localStorage.token=d.token;location="/admin.html"}else msg.textContent=d.message}</script>
</body></html>
