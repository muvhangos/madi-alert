<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>
    Create Madi Alert Account
  </title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 450px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.1);
    }

    h1,
    h2 {
      text-align: center;
    }

    h1 {
      color: #087ea4;
    }

    input,
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #087ea4;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #066681;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      font-weight: bold;
      min-height: 24px;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #087ea4;
      font-weight: bold;
    }

    .hint {
      font-size: 13px;
      color: #555;
      margin-top: 0;
    }
  </style>

</head>

<body>

  <div class="container">


<h1>💧 Madi Alert</h1>

<h2>Create Account</h2>

<input
  type="text"
  id="name"
  placeholder="Full Name"
  autocomplete="name"
>

<input
  type="tel"
  id="phoneNumber"
  placeholder="+27821234567"
  autocomplete="tel"
>

<p class="hint">
  Enter your mobile number with the country code.
  Example: +27821234567
</p>

<button
  type="button"
  id="registerButton"
>
  Create Account
</button>

<p id="message"></p>

<div class="login">
  Already have an account?
  <a href="/login.html">
    Login
  </a>
</div>


  </div>

  <script src="/auth.js"></script>

</body>

</html>
